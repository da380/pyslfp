name: CI

on:
  # Runs on pull requests into main, so that a failing change is never merged
  # and main is always in a working state. The suite is run locally (the
  # pre-push hook) before work goes to develop, so runs on develop pushes, or on
  # main after a merge, would repeat the same checks.
  pull_request:
    branches: [main]
  # The slow tests are excluded from the pull request runs; `full-tests` picks
  # them up, and is run on demand from the Actions tab.
  workflow_dispatch:
  # The release workflow (publish.yml) calls this one on the tagged code and
  # publishes only if every job passes, `full-tests` included.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to an open pull request supersedes the run in progress on it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep the dataset cache inside the workspace rather than at ~/.pyslfp_data,
  # so that the path in the cache step and the path the library uses are the
  # same string on Linux, macOS and Windows alike.
  PYSLFP_DATA: ${{ github.workspace }}/.pyslfp_data

jobs:
  # Linting, formatting, notebook stripping and the file-hygiene checks, taken
  # straight from .pre-commit-config.yaml so that the hooks and CI can never
  # disagree about what "clean" means; running `ruff check` alone would let
  # formatting drift past CI unnoticed. Runs once on Linux: none of these
  # checks are platform-dependent.
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run hooks
        env:
          # `no-commit-to-branch` guards local commits; on a CI checkout of main
          # it would fail every run. `pytest` is a pre-push hook and is covered
          # by the test job below, across all three platforms.
          SKIP: no-commit-to-branch,pytest
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is worth knowing about on the others too.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev

      - name: Cache pyslfp datasets
        uses: actions/cache@v6
        with:
          path: ${{ env.PYSLFP_DATA }}
          # The key hashes the downloader, which holds the Zenodo record id, so
          # a new record invalidates the cache. hashFiles returns an empty
          # string for a pattern that matches nothing, so the path must follow
          # the file if it moves.
          key: ${{ runner.os }}-pyslfp-data-${{ hashFiles('pyslfp/data/downloader.py') }}
          restore-keys: |
            ${{ runner.os }}-pyslfp-data-

      - name: Test with pytest
        run: poetry run pytest --cov=pyslfp --cov-report=term-missing

      - name: Build package
        run: poetry build

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev

      # Read the Docs deliberately builds without fail_on_warning (see
      # .readthedocs.yaml), so this job is where a warning fails a pull request.
      # The API stubs are generated by conf.py, so this covers a module that has
      # been added, renamed or moved as well as the prose.
      - name: Build documentation
        run: poetry run sphinx-build -b html -W --keep-going docs/source docs/build/html

      - name: Upload built documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7

  # The slow tests are the ones that read the real Zenodo datasets (the ICE-NG
  # histories, the IHO seas and HydroBASINS shapefiles, the GLOSS tide gauge
  # network) and run every tutorial script: several hundred megabytes and tens
  # of minutes, which is why they are deselected by default.
  #
  # They run on every release, through the release workflow, which inherits
  # the `release` event, and by hand from Actions -> CI -> Run workflow, which
  # is worth doing after a change to the regions, ice or tide gauge code.
  full-tests:
    name: Full test suite (including slow)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev

      - name: Cache pyslfp datasets
        uses: actions/cache@v6
        with:
          path: ${{ env.PYSLFP_DATA }}
          key: ${{ runner.os }}-pyslfp-data-${{ hashFiles('pyslfp/data/downloader.py') }}
          restore-keys: |
            ${{ runner.os }}-pyslfp-data-

      # test_iceng_real_data_integration is guarded by a skipif that checks for
      # the ICE-7G directory at import time, so on a cold cache it would skip
      # rather than run and the job would pass without testing anything.
      # Fetching first turns that skip into a real assertion. ETOPO is not
      # fetched: nothing in the test suite reads it, and it is 198 MB.
      - name: Fetch datasets
        run: |
          poetry run python -c "
          from pyslfp.data.downloader import ensure_data
          for key in ['LOVE_NUMBERS', 'ICE7G', 'ICE6G', 'ICE5G', 'HYDRO',
                      'IHO_SEAS', 'TIDE_GAUGE', 'IMBIE_ANT', 'MOUGINOT_GRL']:
              ensure_data(key)
          "

      - name: Test with pytest
        run: poetry run pytest -m "" --cov=pyslfp --cov-report=term-missing
