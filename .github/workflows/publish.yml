name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The release tag and the version in pyproject.toml are set by hand, in two
  # different places, several steps apart (see CONTRIBUTING.md). If they
  # disagree, PyPI accepts whatever pyproject says and the tag then points at
  # something that was never published under that name. PyPI does not allow a
  # version to be re-uploaded, so this is checked first, before the tests spend
  # their time on a release that could not be published anyway.
  version:
    name: Tag matches version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Check the tag matches the package version
        run: |
          version=$(poetry version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${version}'."
            exit 1
          fi
          echo "Tag and version agree on ${version}."

  # The whole of CI on the tagged code: linting, the fast suite on all three
  # platforms, the documentation build, and the slow tests, which the `release`
  # event switches on. Nothing is published unless every job passes.
  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      # `poetry build` reads pyproject.toml and the source tree; it does not
      # need the dependencies installed. Not installing them keeps Cartopy and
      # pyshtools out of the publish path, so a wheel that is slow or briefly
      # unavailable cannot fail a release.
      - name: Build package
        run: poetry build

      - name: Publish package to PyPI
        run: poetry publish --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}
