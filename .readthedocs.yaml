version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  # Cartopy and its shapely dependency link against these; the wheels normally
  # bundle them, but the source builds Read the Docs may fall back to do not.
  apt_packages:
    - libgeos-dev
    - libproj-dev
  jobs:
    post_create_environment:
      - pip install poetry
    post_install:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --with dev

# The API pages are generated by sphinx-apidoc, which docs/source/conf.py runs
# on `builder-inited`. There is deliberately no step for it here: a local build,
# the CI docs job and this one all go through the same conf.py, so they cannot
# drift apart. Adding or renaming a module needs no action beyond the rename.
sphinx:
  configuration: docs/source/conf.py
# fail_on_warning is deliberately not set. The CI docs job builds the same
# configuration with -W, so a warning introduced by a change fails a pull
# request before it can reach here. Repeating that on this side would only add
# a way for the published documentation to break for a reason outside the
# repository: conf.py fetches intersphinx inventories over the network, and an
# unreachable one is a warning like any other.
